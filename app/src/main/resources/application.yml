server:
  port: 9002
  address: 0.0.0.0

spring:
  application:
    name: ${APPLICATION_NAME:portal-ng-history}
  jackson:
    # Boot 4 defaults to Jackson 3; keep Boot-3 Jackson 2 conventions for the
    # Jackson2ObjectMapperBuilder-built mapper used with Zalando ProblemModule.
    use-jackson2-defaults: true
    serialization:
      # needed for serializing objects of type object
      fail-on-empty-beans: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs #Keycloak Endpoint
  datasource:
    url: jdbc:postgresql://${HISTORY_DB_HOST}:${HISTORY_DB_PORT}/${HISTORY_DB}
    username: ${HISTORY_DB_USERNAME}
    password: ${HISTORY_DB_PASSWORD}
    hikari:
      # Explicit, env-overridable pool sizing. Sized to complement the boundedElastic
      # scheduler that runs the blocking JPA calls off the Netty event loop.
      maximum-pool-size: ${HISTORY_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${HISTORY_DB_POOL_MIN_IDLE:2}
  jpa:
    database: postgresql
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: "classpath:/db/changelog.xml"
  reactor:
    context-propagation: auto

history:
  save-interval: 72
  delete-interval: 0 0 * * * *

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  info:
    build:
      enabled: true
    env:
      enabled: true
    git:
      enabled: true
    java:
      enabled: true
  observations:
    enable:
      spring:
        # Security observations carry no URI, so TracingConfig cannot filter them per path:
        # re-enabling this brings back orphaned security spans for every probe and scrape.
        security: false
  tracing:
    export:
      enabled: ${TRACING_ENABLED:true}
      zipkin:
        # Endpoint defaults are needed even when export is disabled: Boot resolves this
        # placeholder while evaluating the exporter's condition, so an unset
        # COLLECTOR_HOST fails startup.
        endpoint: ${COLLECTOR_HOST:http://localhost}:${COLLECTOR_PORT:9411}/api/v2/spans
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logger:
  requestIdHeaderName: ${REQUEST_ID_HEADER_NAME:X-Request-Id}
  enabled: true
  excludePaths:
    - "/actuator/**"

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        traceId: trace_id
        spanId: span_id
  level:
    root: info
