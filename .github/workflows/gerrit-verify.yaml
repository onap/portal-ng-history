---
name: Gerrit Composed Gradle Verify CLM

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: true
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: true
        type: string

concurrency:
  # yamllint disable-line rule:line-length
  group: composed-gradle-verify-clm${{ github.workflow }}-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}
  cancel-in-progress: true

# Default to no permissions; each job grants only what it needs.
permissions: {}

jobs:
  prepare:
    name: Clear Gerrit vote
    runs-on: ubuntu-latest
    permissions:
      contents: read  # gerrit-review-action votes over SSH only
    steps:
      - name: Clear votes
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@1e3eae766b3de755a2e87aa216cedebbaf9c8292  # v1.1.3
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          # Review-only Gerrit SSH voting key; not gated by an Environment
          # yamllint disable-line rule:line-length
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}  # zizmor: ignore[secrets-outside-env]
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
          comment-only: true
      - name: Allow replication
        run: sleep 10s

  gradle-verify-clm:
    name: Gradle build and Nexus IQ scan
    needs: prepare
    permissions:
      contents: read  # the CLM lane only checks out code
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/sonatype-lifecycle.yaml@5882f138dd24fcd6cb4ebc8bb3a68cee45a437a6  # v0.3.0
    with:
      gerrit_refspec: ${{ inputs.GERRIT_REFSPEC }}
      gerrit_project: ${{ inputs.GERRIT_PROJECT }}
      gerrit_branch: ${{ inputs.GERRIT_BRANCH }}
      # Build before scanning so Nexus IQ sees resolved dependencies.
      # The lane runs the build inside the scan job, so the two share a
      # workspace; the predecessor ran them in separate jobs and the
      # scan never saw the build output.
      build_type: gradle
      # JDK that runs Gradle itself, not the one the code targets:
      # Gradle 8.14 does not run on the Java 25 toolchain declared in
      # app/build.gradle, which foojay-resolver auto-provisions instead.
      java_version: '17'
      # Gradle resolves plugins, dependencies and the Java 25 toolchain
      # from CDNs that are impractical to enumerate in the egress
      # allow-list; audit the job rather than blocking it.
      build_permit_egress_traffic: true
    secrets:
      nexus_iq_password: ${{ secrets.NEXUS_IQ_PASSWORD }}

  vote:
    name: Report Gerrit vote
    if: ${{ always() }}
    permissions:
      contents: read  # gerrit-review-action votes over SSH only
      actions: read  # workflow-conclusion queries the Actions API
    # yamllint enable rule:line-length
    needs: [prepare, gradle-verify-clm]
    runs-on: ubuntu-latest
    steps:
      - name: Get conclusion
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@8eac7f17381a6917bc04fec3e2c92e70ebc37526  # v3.0.0
      - name: Set vote
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@1e3eae766b3de755a2e87aa216cedebbaf9c8292  # v1.1.3
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          # Review-only Gerrit SSH voting key; not gated by an Environment
          # yamllint disable-line rule:line-length
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}  # zizmor: ignore[secrets-outside-env]
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
          comment-only: true
